<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout (title, content)" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Личный кабинет - SURAJ SHOP</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; color: #333; background: #f9f9f9; }
        .site-header { background: white; border-bottom: 1px solid #e0e0e0; position: sticky; top: 0; z-index: 100; background: rgba(255,255,255,0.95); backdrop-filter: blur(5px); }
        .header-inner {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            min-height: 60px;
            max-width: 1400px;
            margin: 0 auto;
            padding: 10px 20px;
            gap: 20px;
        }
        .logo { font-size: 24px; font-weight: 800; text-transform: uppercase; text-decoration: none; color: black; justify-self: start; }
        .site-nav { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: center; justify-self: center; }
        .header-logout { justify-self: end; margin: 0; }
        @media (max-width: 900px) {
            .header-inner { grid-template-columns: 1fr auto; grid-template-rows: auto auto; }
            .site-nav { grid-column: 1 / -1; justify-self: center; }
        }
        .site-nav__link { font-size: 13px; font-weight: 500; text-transform: uppercase; text-decoration: none; color: black; white-space: nowrap; background: none; border: none; cursor: pointer; font-family: inherit; padding: 0; }
        .site-nav__link:hover { opacity: 0.7; }
        .site-nav__sep { color: #ccc; user-select: none; }
        .homepage-container { display: flex; flex-wrap: wrap; width: 100%; }
        .hero-block { position: relative; display: flex; align-items: center; justify-content: center; text-decoration: none; color: white; overflow: hidden; background-size: cover; background-position: center; height: 60vh; width: 100%; }
        @media (min-width: 768px) { .hero-block { width: 33.333%; height: 80vh; } }
        .hero-block--men { background-image: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('/images/МУЖЧИН.jpg'); }
        .hero-block--women { background-image: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('/images/ЖЕНЩИН.jpg'); }
        .hero-block--kids { background-image: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('/images/ДЕТЕЙ.jpg'); }
        .hero-block::before { content: ''; position: absolute; inset: 0; background: rgba(0, 0, 0, 0.3); transition: background 0.3s; }
        .hero-block:hover::before { background: rgba(0, 0, 0, 0.5); }
        .hero-content { position: relative; z-index: 2; text-align: center; }
        .hero-content h2 { font-size: 2.5rem; font-weight: 800; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 2px; }
        .hero-btn { display: inline-block; padding: 12px 28px; background: white; color: black; font-weight: bold; text-transform: uppercase; border-radius: 30px; text-decoration: none; transition: all 0.3s; }
        .hero-btn:hover { background: black; color: white; transform: scale(1.05); }
        .page-section { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .page-title { font-size: 32px; font-weight: 800; margin-bottom: 30px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 25px; }
        .product-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 15px rgba(0,0,0,0.05); transition: transform 0.2s; }
        .product-card:hover { transform: translateY(-4px); }
        .product-card__img { height: 280px; background: #f5f5f5; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .product-card__img img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .product-card__body { padding: 15px; }
        .product-card__name { font-weight: 600; font-size: 16px; margin-bottom: 6px; }
        .product-card__desc { font-size: 13px; color: #666; line-height: 1.45; margin-bottom: 10px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .product-card__price { font-size: 20px; font-weight: bold; color: #e91e63; margin-bottom: 8px; }
        .product-card__stock { font-size: 12px; color: #888; margin-bottom: 12px; }
        .btn-cart { display: block; background: #f97316; color: white; padding: 10px 12px; border-radius: 8px; text-decoration: none; font-size: 14px; font-weight: bold; text-align: center; }
        .btn-cart:hover { background: #ea580c; }
        .site-footer { border-top: 1px solid #e0e0e0; padding: 40px 0; margin-top: 0; text-align: center; background: white; }
        .footer-copy { font-size: 12px; color: #666; }
    </style>
</head>
<body>

<header class="site-header">
    <div class="header-inner">
        <a href="/profile" class="logo">SURAJ SHOP</a>
        <nav class="site-nav">
            <a href="/profile" class="site-nav__link">Главная</a>
            <span class="site-nav__sep">|</span>
            <a href="/products?categoryId=4" class="site-nav__link">Новинки</a>
            <span class="site-nav__sep">|</span>
            <a href="/products?categoryId=1" class="site-nav__link">Мужское</a>
            <span class="site-nav__sep">|</span>
            <a href="/products?categoryId=2" class="site-nav__link">Женское</a>
            <span class="site-nav__sep">|</span>
            <a href="/products?categoryId=3" class="site-nav__link">Детское</a>
            <span class="site-nav__sep">|</span>
            <a href="/products?categoryId=5" class="site-nav__link">Аксессуары</a>
            <span class="site-nav__sep">|</span>
            <a href="/products?categoryId=6" class="site-nav__link">Скидки</a>
            <span class="site-nav__sep">|</span>
            <a href="/cart" class="site-nav__link">Моя корзина</a>
            <span class="site-nav__sep">|</span>
            <a href="/profile/orders" class="site-nav__link">Мои заказы</a>
        </nav>
        <form action="/logout" method="post" class="header-logout">
            <button type="submit" class="site-nav__link">Выход</button>
        </form>
    </div>
</header>

<main th:replace="${content}">Контент страницы</main>

<footer class="site-footer">
    <p class="footer-copy">© 2026 Suraj-shop. Все права защищены.</p>
</footer>

</body>
</html>
