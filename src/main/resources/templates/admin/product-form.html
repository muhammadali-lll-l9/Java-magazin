<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{common/layout :: layout('Форма товара - Админ панель', ~{::main})}">
<body>
<main>
  <div style="max-width: 600px; margin: 50px auto; background: white; padding: 30px; border-radius: 15px;">
    <h2 th:text="${product.id} ? 'Редактировать товар' : 'Новый товар'">Форма товара</h2>
    <form action="/admin/products/save" method="post" style="margin-top: 20px;">
      <input type="hidden" name="id" th:value="${product.id}">
      <div style="margin-bottom: 15px;">
        <label>Название</label>
        <input type="text" name="name" th:value="${product.name}" style="width:100%; padding:10px;" required>
      </div>
      <div style="margin-bottom: 15px;">
        <label>Ссылка на фото (URL)</label>
        <input type="text" name="imageUrl" th:value="${product.imageUrl}" placeholder="https://... или /images/tovar.jpg" style="width:100%; padding:10px;">
        <p style="font-size:12px; color:#888; margin-top:6px;">Файлы кладите в <code>src/main/resources/static/images/</code></p>
      </div>
      <div style="margin-bottom: 15px;">
        <label>Краткое описание</label>
        <textarea name="description" style="width:100%; padding:10px; min-height:80px;" th:text="${product.description}" placeholder="Текст под названием на карточке товара"></textarea>
      </div>
      <div style="margin-bottom: 15px;">
        <label>Цена</label>
        <input type="number" step="0.01" name="price" th:value="${product.price}" style="width:100%; padding:10px;" required>
      </div>
      <div style="margin-bottom: 15px;">
        <label>Количество</label>
        <input type="number" name="stock" th:value="${product.stock}" style="width:100%; padding:10px;" required>
      </div>
      <div style="margin-bottom: 15px;">
        <label>Категория</label>
        <select name="category.id" style="width:100%; padding:10px;">
          <option value="">Без категории</option>
          <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}" th:selected="${product.category != null && product.category.id == cat.id}"></option>
        </select>
      </div>
      <button type="submit" style="background:#1a1a2e; color:white; padding:10px 20px; border:none; border-radius:5px;">Сохранить</button>
      <a href="/admin/dashboard?section=products" style="margin-left:10px;">Отмена</a>
    </form>
  </div>
</main>
</body>
</html>
